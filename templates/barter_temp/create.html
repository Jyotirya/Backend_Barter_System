<body>
    <h1> Create </h1>

    <form id="createForm">
        <input type="text" id="name" placeholder="Name: " required default="Laptop"/><br>
        <input type="text" id="description" placeholder="Item Description: " required default="Grey" /><br>
        <input type="number" id="price" placeholder="Price: " required default=20/><br>
        <input type="time" id="deadline_time" required /><br>
        <input type="date" id="deadline_date" required /><br>
        <button type="submit">Create</button>
    </form>

    <script>
        document.getElementById('createForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value
            const description = document.getElementById('description').value
            const price = document.getElementById('price').value
            const deadline_time = document.getElementById('deadline_time').value
            const deadline_date = document.getElementById('deadline_date').value

            const deadlineISO = new Date(`${deadline_date}T${deadline_time}`).toISOString();

            function getCookie(name) {
                let cookieValue = null;
                if (document.cookie && document.cookie !== "") {
                    const cookies = document.cookie.split(";");
                    for (let cookie of cookies) {
                        cookie = cookie.trim();
                        if (cookie.startsWith(name + "=")) {
                            cookieValue = decodeURIComponent(
                                cookie.substring(name.length + 1)
                            );
                            break;
                        }
                    }
                }
                return cookieValue;
            }
            
            const response = await fetch('/api/auth/barter/create/', {
                method: 'POST',
                headers: {
                    "Content-Type": "application/json",
                    "X-CSRFToken": getCookie("csrftoken"),
                },
                credentials: "include",
                body: JSON.stringify({
                    "name": name,
                    "description": description,
                    "price": price,
                    "deadline": deadlineISO
                })
            });

            if (!response.ok) {
                const error = await response.text()
                console.error("API error:", error)
                return;
            }

            const data = await response.json()
            console.log(data)

        })
    </script>
</body>
