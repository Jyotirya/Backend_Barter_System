<h1>Search Page</h1>

<body>
    <form id="searchForm">
        <input type="text" id="search" placeholder="Search Here" required><br>
        <button type="submit">Register</button>
    </form>
    
    <script>
        document.getElementById('searchForm').addEventListener('submit', async (e) => {
            e.preventDefault();
    
            const search = document.getElementById('search').value;
    
            const response = await fetch('/api/auth/barter/search/', {
                method: 'POST',
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    "search": search
                })
            })

            const data = await response.json();
            console.log(data);
        })
    </script>
</body>
