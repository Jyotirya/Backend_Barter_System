<html>
    <head>
        <title>Logout</title>
    </head>

    <body>
        <h1>Logout</h1>
        <button id="logout">Logout</button>
        <script>
            document.getElementById('logout').addEventListener('click', async () => {
                const response = await fetch('/api/auth/logout/', {
                    method: 'POST',
                    credentials: 'include'
                })

                const data = await response.json();
                console.log(data);
            })
        </script>
    </body>
</html>
