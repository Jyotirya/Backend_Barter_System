<h1>Register</h1>
<form id="registerForm">
    {% csrf_token %}
    <input type="email" id="email" placeholder="Email" required><br>
    <input type="text" id="firstname" placeholder="First Name" required><br>
    <input type="text" id="lastname" placeholder="Last Name" required><br>
    <input type="text" id="address1" placeholder="Address 1" required><br>
    <input type="text" id="address2" placeholder="Address 2" required><br>
    <input type="password" id="password" placeholder="Password" required><br>
    <button type="submit">Register</button>
</form>

<p id="result"></p>

<script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const firstname = document.getElementById('firstname').value;
        const lastname = document.getElementById('lastname').value;
        const address1 = document.getElementById('address1').value;
        const address2 = document.getElementById('address2').value;
        
        const response = await fetch('/api/auth/user/signup/', {
            method: 'POST',
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                "email": email,
                "password": password,
                "first_name": firstname,
                "last_name": lastname,
                "address1": address1,
                "address2": address2,
            })
        });

        const data = await response.json();

        document.getElementById("result").innerText = response.ok ? data.message : JSON.stringify(data);
    })
</script>
